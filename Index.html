<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Deluxe</title>
    <style>
        body { margin: 0; background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { border: 4px solid #222; border-radius: 12px; touch-action: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        #ui-layer { position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; width: 320px; height: 480px; pointer-events: none; }
        
        #stats-card {
            background: #f3f0c3;
            border: 4px solid #543847;
            border-radius: 15px;
            padding: 25px;
            width: 200px;
            text-align: center;
            box-shadow: 0 8px 0 #543847;
            pointer-events: auto;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .label { color: #8a7a55; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: #f7941d; font-size: 36px; font-weight: bold; text-shadow: 2px 2px 0 #543847; margin-bottom: 20px; }
        
        #btn-play {
            padding: 12px 35px;
            background: #70c04a;
            color: white;
            border: 3px solid #fff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4d8532;
            transition: transform 0.1s;
        }
        #btn-play:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d8532; }

        #score-top { position: absolute; top: 50px; color: white; font-size: 60px; font-weight: bold; text-shadow: 4px 4px 0 #543847; z-index: 10; pointer-events: none; }
    </style>
</head>
<body ontouchstart="handleInput(event)" onmousedown="handleInput(event)">

    <div id="score-top">0</div>

    <div id="ui-layer">
        <div id="stats-card">
            <div class="label">Score</div>
            <div id="current-score" class="value">0</div>
            <div class="label">Best</div>
            <div id="best-score" class="value">0</div>
            <button id="btn-play" onclick="resetGame(event)">OK</button>
        </div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const scoreTop = document.getElementById('score-top');
        const currentScoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');

        canvas.width = 320;
        canvas.height = 480;

        let birdY = 200, birdV = 0, birdG = 0.2, birdJ = -4.5, birdRotation = 0;
        let pipes = [], score = 0, isStarted = false, isDead = false;
        let highScore = localStorage.getItem('fbHighScore') || 0;
        let clouds = [{x: 50, y: 80, s: 0.2}, {x: 200, y: 150, s: 0.15}, {x: 120, y: 50, s: 0.1}];

        function handleInput(e) {
            if (e.target.id === 'btn-play') return;
            if (isDead) return;
            if (!isStarted) { isStarted = true; loop(); }
            else birdV = birdJ;
        }

        function resetGame(e) {
            if (e) e.stopPropagation();
            birdY = 200; birdV = 0; pipes = []; score = 0;
            isStarted = false; isDead = false;
            scoreTop.innerText = "0";
            scoreTop.style.display = "block";
            uiLayer.style.display = "none";
            draw();
        }

        function die() {
            isDead = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('fbHighScore', highScore);
            }
            currentScoreEl.innerText = score;
            bestScoreEl.innerText = highScore;
            uiLayer.style.display = "flex";
            scoreTop.style.display = "none";
        }

        function loop() {
            if (!isStarted || isDead) return;

            birdV += birdG;
            birdY += birdV;
            birdRotation = Math.min(Math.PI/4, Math.max(-Math.PI/4, birdV * 0.1));

            if (pipes.length === 0 || pipes[pipes.length - 1].x < 170) {
                let h = Math.random() * (canvas.height - 280) + 60;
                pipes.push({ x: canvas.width, h: h, passed: false });
            }

            pipes.forEach((p, i) => {
                p.x -= 1.8;
                if (p.x < 85 && p.x + 52 > 50) {
                    if (birdY < p.h || birdY + 24 > p.h + 150) die();
                }
                if (p.x + 52 < 50 && !p.passed) {
                    score++;
                    scoreTop.innerText = score;
                    p.passed = true;
                }
                if (p.x < -60) pipes.splice(i, 1);
            });

            clouds.forEach(c => {
                c.x -= c.s;
                if (c.x < -100) c.x = canvas.width + 50;
            });

            if (birdY > canvas.height - 30 || birdY < 0) die();

            draw();
            requestAnimationFrame(loop);
        }

        function drawPipe(x, h, isTop) {
            let grd = ctx.createLinearGradient(x, 0, x + 50, 0);
            grd.addColorStop(0, "#73bf2e");
            grd.addColorStop(0.5, "#bfff80");
            grd.addColorStop(1, "#558022");
            ctx.fillStyle = grd;

            if (isTop) {
                ctx.fillRect(x, 0, 50, h);
                ctx.fillStyle = "#558022";
                ctx.fillRect(x - 4, h - 20, 58, 20); // Ободок
            } else {
                ctx.fillRect(x, h + 150, 50, canvas.height);
                ctx.fillStyle = "#558022";
                ctx.fillRect(x - 4, h + 150, 58, 20); // Ободок
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(65, birdY + 12);
            ctx.rotate(birdRotation);
            
            // Тело
            ctx.fillStyle = "#f7e01e";
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#543847";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Крыло
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.ellipse(-8, 2, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Глаз
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(8, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(10, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            // Клюв
            ctx.fillStyle = "#f7941d";
            ctx.beginPath();
            ctx.moveTo(14, 0);
            ctx.lineTo(24, 4);
            ctx.lineTo(14, 8);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            // Небо
            let skyGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrd.addColorStop(0, "#4ec0ca");
            skyGrd.addColorStop(1, "#d1f2f5");
            ctx.fillStyle = skyGrd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Облака
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 20, 0, Math.PI*2);
                ctx.arc(c.x+25, c.y, 15, 0, Math.PI*2);
                ctx.arc(c.x-20, c.y, 15, 0, Math.PI*2);
                ctx.fill();
            });

            pipes.forEach(p => {
                drawPipe(p.x, p.h, true);
                drawPipe(p.x, p.h, false);
            });

            // Земля
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - 55, canvas.width, 8);

            drawBird();
        }

        draw();
    </script>
</body>
</html>
